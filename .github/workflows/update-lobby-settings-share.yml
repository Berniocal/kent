name: Update Kent lobby settings and share

on:
  push:
    paths:
      - '.kent-lobby-settings-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Kent
        run: python3 .kent-lobby-patch.py
      - name: Check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*?)</script>',s,re.S)
          assert m, 'module script not found'
          Path('/tmp/kent-check.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/kent-check.mjs
      - name: Commit
        run: |
          git config user.name "Bernio"
          git config user.email "jendabernard@gmail.com"
          git add index.html
          git rm .kent-lobby-patch.py .kent-lobby-settings-trigger .github/workflows/update-lobby-settings-share.yml
          git commit -m "Move Kent game settings to lobby and simplify invite links"
          git push
