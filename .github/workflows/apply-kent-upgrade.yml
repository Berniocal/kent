name: Apply Kent upgrade

on:
  push:
    paths:
      - '.kent-upgrade-trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild index.html
        run: |
          cat .kent-upgrade-1 .kent-upgrade-2 .kent-upgrade-3 .kent-upgrade-4 .kent-upgrade-5 | base64 -d | gzip -d > index.html
          test "$(git hash-object index.html)" = "227a913097e0284c230cce1eb9bba1f9987376cb"
      - name: Commit upgrade
        run: |
          git config user.name "Bernio"
          git config user.email "jendabernard@gmail.com"
          git add index.html
          git rm .kent-upgrade-1 .kent-upgrade-2 .kent-upgrade-3 .kent-upgrade-4 .kent-upgrade-5 .kent-upgrade-trigger
          git commit -m "Support more players and remote Kent signals"
          git push
