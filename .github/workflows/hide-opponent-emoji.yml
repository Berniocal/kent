name: Hide opponent Kent emoji

on:
  push:
    paths:
      - '.kent-hide-emoji-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide opponent signal in lobby
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='card.innerHTML=`<div class="emoji-team-head">Tým ${team}</div><div class="emoji-current">${current}</div>`;'
          new='card.innerHTML=`<div class="emoji-team-head">Tým ${team}</div><div class="emoji-current">${myTeam===team?current:"🔒"}</div>`;'
          if old not in s:
              raise SystemExit('Emoji lobby line not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Bernio"
          git config user.email "jendabernard@gmail.com"
          git add index.html
          git rm .kent-hide-emoji-trigger
          git commit -m "Keep opponent Kent emoji secret"
          git push
